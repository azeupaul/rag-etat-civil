<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <title>Flask & HTMX</title>
        <!-- Chargement d'HTMX -->
        <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js" 
            integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg"
            crossorigin="anonymous"></script>
    </head>
    <body>
        <h1>Mon application Flask et HTMX</h1>
        
        <!-- Zone cible pour le contenu dynamique -->
        <div id="resultat">
            <button hx-post="/" hx-target="#resultat" hx-swap="outerHTML">
                Clique-moi
            </button>
        </div>
    </body>
</html>
