[project]
name = "rag-etat-civil"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-htmx>=0.4.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_etat_civil"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/rag_etat_civil/web/static/vendor"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle (erreurs)
    "W",   # pycodestyle (avertissements)
    "F",   # pyflakes
    "I",   # tri des imports
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplifications
    "S",   # bandit (sécurité)
    "RUF", # règles propres à ruff
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert autorisé dans les tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
