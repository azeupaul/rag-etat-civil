[project]
name = "rag-etat-civil"
version = "0.1.0"
description = "Question answering with citations over Law No. 2024/016 of 23 December 2024 (civil status, Cameroon). RAG demo."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.9.0",
    "flask>=3.1.3",
    "flask-htmx>=0.4.0",
    "numpy>=2.5.4",
    "py-rust-stemmers>=0.1.8",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
gemini = [
    "google-genai>=2.29.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_etat_civil"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/rag_etat_civil/web/static/vendor"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle (erreurs)
    "W",   # pycodestyle (avertissements)
    "F",   # pyflakes
    "I",   # tri des imports
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplifications
    "S",   # bandit (sécurité)
    "RUF", # règles propres à ruff
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert autorisé dans les tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not model and not llm'"
markers = [
    "model: needs the real embedding model (about 2.2 GB, run with `make test-model`)",
    "llm: calls the real language model with your API key (run with `make test-llm`)",
]
